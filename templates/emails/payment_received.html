{% extends "emails/base.html" %}
{% block content %}
<h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Payment Confirmed</h1>
<p style="color: #525252; font-size: 14px;">Hi {{ display_name }},</p>
<p style="color: #525252; font-size: 14px;">Your payment of <strong>RM {{ '%.2f' | format(amount) }}</strong> for order <code>{{ order_id }}</code> has been received.</p>
<p style="color: #525252; font-size: 14px;">Card type: {{ card_type | capitalize }}</p>
{% endblock %}
