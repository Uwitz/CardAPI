{% extends "emails/base.html" %}
{% block content %}
<h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Team Invitation</h1>
<p style="color: #525252; font-size: 14px;">Hi {{ display_name }},</p>
<p style="color: #525252; font-size: 14px;">You've been invited to join <strong>{{ org_name }}</strong> on Uwitz Cards.</p>
<p style="color: #525252; font-size: 14px;">Email: <code>{{ email }}</code></p>
<p style="color: #525252; font-size: 14px;">Temporary password: <code>{{ temp_password }}</code></p>
<a href="{{ site_url }}/dashboard/login" style="display: inline-block; padding: 10px 24px; background: #dc2626; color: white; border-radius: 8px; font-weight: 500; font-size: 14px; text-decoration: none; margin-top: 16px;">Sign In</a>
{% endblock %}
