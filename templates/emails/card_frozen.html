{% extends "emails/base.html" %}
{% block content %}
<h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Card Frozen</h1>
<p style="color: #525252; font-size: 14px;">Hi {{ display_name }},</p>
<p style="color: #525252; font-size: 14px;">Your card <code>{{ card_id }}</code> has been frozen and is no longer accessible.</p>
{% if reason %}<p style="color: #525252; font-size: 14px;">Reason: {{ reason }}</p>{% endif %}
{% endblock %}
