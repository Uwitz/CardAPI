{% extends "emails/base.html" %}
{% block content %}
<h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Password Reset</h1>
<p style="color: #525252; font-size: 14px;">Hi {{ display_name }},</p>
<p style="color: #525252; font-size: 14px;">Use this code to reset your password: <code>{{ reset_code }}</code></p>
<p style="color: #525252; font-size: 14px;">This code expires in 1 hour. If you didn't request this, ignore this email.</p>
{% endblock %}
