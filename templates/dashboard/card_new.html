{% extends "base.html" %}
{% block title %}New Card — {{ brand }}{% endblock %}
{% block page_title %}Create New Card{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fade-up">
  <div class="card">
    <h2 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 1rem;">Card Type</h2>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
      <button class="card card-type-btn active" data-type="social" onclick="selectType(this)">
        <div class="font-semibold text-sm">Social Card</div>
        <div class="text-xs text-muted">vCard contact</div>
        <div class="text-xs font-bold mt-1" style="color: var(--primary-500);">RM {{ card_pricing.social.physical }}</div>
      </button>
      <button class="card card-type-btn" data-type="taglink" onclick="selectType(this)">
        <div class="font-semibold text-sm">TagLink Card</div>
        <div class="text-xs text-muted">Dynamic redirect</div>
        <div class="text-xs font-bold mt-1" style="color: var(--primary-500);">RM {{ card_pricing.taglink.physical }}</div>
      </button>
    </div>

    <form id="card-form" method="POST" action="/api/users/me/cards" onsubmit="submitCard(event)">
      <input type="hidden" name="card_type" id="card_type" value="social">

      <div class="form-group">
        <label class="form-label">Tier</label>
        <select name="card_tier" class="form-input">
          <option value="digital">Digital (Free)</option>
          <option value="physical" selected>Physical Card</option>
        </select>
      </div>

      <!-- vCard fields (social) -->
      <div id="vcard-fields">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="vc-fn" class="form-input" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label class="form-label">Organisation</label>
          <input type="text" id="vc-org" class="form-input" placeholder="Company Ltd">
        </div>
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" id="vc-title" class="form-input" placeholder="Software Engineer">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="vc-email" class="form-input" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="vc-phone" class="form-input" placeholder="+60 12 345 6789">
        </div>
        <div class="form-group">
          <label class="form-label">Website</label>
          <input type="url" id="vc-url" class="form-input" placeholder="https://example.com">
        </div>
      </div>

      <!-- TagLink fields -->
      <div id="taglink-fields" style="display: none;">
        <div class="form-group">
          <label class="form-label">Redirect URL (optional)</label>
          <input type="url" id="tl-url" class="form-input" placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Plain Text (optional)</label>
          <textarea id="tl-text" class="form-input" rows="3" maxlength="500" placeholder="Visit our website!"></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-4">Create Card</button>
    </form>
  </div>
</div>
{% endblock %}
{% block head %}
<script>
function selectType(btn) {
  document.querySelectorAll('.card-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const type = btn.dataset.type;
  document.getElementById('card_type').value = type;
  document.getElementById('vcard-fields').style.display = type === 'social' ? 'block' : 'none';
  document.getElementById('taglink-fields').style.display = type === 'taglink' ? 'block' : 'none';
}

function buildVCard() {
  const fields = {
    'FN': document.getElementById('vc-fn').value,
    'ORG': document.getElementById('vc-org').value,
    'TITLE': document.getElementById('vc-title').value,
    'EMAIL': document.getElementById('vc-email').value,
    'TEL': document.getElementById('vc-phone').value,
    'URL': document.getElementById('vc-url').value,
  };
  let vcard = 'BEGIN:VCARD\nVERSION:4.0\n';
  for (const [key, val] of Object.entries(fields)) {
    if (val) vcard += `${key}:${val}\n`;
  }
  vcard += 'END:VCARD\n';
  return vcard;
}

async function submitCard(e) {
  e.preventDefault();
  const type = document.getElementById('card_type').value;
  const tier = document.querySelector('[name="card_tier"]').value;

  let body = { card_type: type, card_tier: tier };
  if (type === 'social') {
    body.vcard_data = buildVCard();
  } else {
    body.redirect_url = document.getElementById('tl-url').value || null;
    body.plain_text = document.getElementById('tl-text').value || null;
  }

  const token = localStorage.getItem('token');
  const res = await fetch('/api/users/me/cards', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = '/dashboard/cards/' + data.card_id;
  } else {
    alert(data.detail?.error || 'Failed to create card');
  }
}
</script>
<style>.card-type-btn { cursor: pointer; text-align: left; transition: all 0.15s; border: 2px solid transparent; } .card-type-btn.active { border-color: var(--primary-500); }</style>
{% endblock %}
