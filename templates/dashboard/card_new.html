{% extends "base.html" %}
{% block title %}New Card — {{ brand }}{% endblock %}
{% block page_title %}Create New Card{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fade-up">
  <div class="card">
    <h3 style="margin-bottom: var(--space-4);">Choose card type</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: var(--space-6);">
      <button class="card-type-btn active" data-type="social" onclick="selectType(this)" style="background: var(--surface-card); border: 2px solid var(--accent); border-radius: var(--radius-lg); padding: 20px; cursor: pointer; text-align: left; transition: all 0.15s;">
        <div style="font: var(--fw-semibold) 14px/1.3 var(--font-sans); color: var(--text-strong);">Social Card</div>
        <div style="font: 400 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px;">vCard contact sharing</div>
        <div style="font: var(--fw-bold) 13px/1 var(--font-mono); color: var(--accent); margin-top: 8px;">RM {{ card_pricing.social.physical }}</div>
      </button>
      <button class="card-type-btn" data-type="taglink" onclick="selectType(this)" style="background: var(--surface-card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 20px; cursor: pointer; text-align: left; transition: all 0.15s;">
        <div style="font: var(--fw-semibold) 14px/1.3 var(--font-sans); color: var(--text-strong);">TagLink Card</div>
        <div style="font: 400 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px;">Dynamic redirect</div>
        <div style="font: var(--fw-bold) 13px/1 var(--font-mono); color: var(--accent); margin-top: 8px;">RM {{ card_pricing.taglink.physical }}</div>
      </button>
    </div>

    <form id="card-form" onsubmit="submitCard(event)">
      <input type="hidden" name="card_type" id="card_type" value="social">

      <div class="form-group">
        <label class="form-label">Tier</label>
        <select name="card_tier">
          <option value="digital">Digital (Free)</option>
          <option value="physical" selected>Physical Card</option>
        </select>
      </div>

      <div id="vcard-fields">
        <div style="font: var(--fw-semibold) 12px/1 var(--font-sans); color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: var(--space-3);">Contact Information</div>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="vc-fn" placeholder="John Doe">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Organisation</label>
            <input type="text" id="vc-org" placeholder="Company Ltd">
          </div>
          <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" id="vc-title" placeholder="Software Engineer">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="vc-email" placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" id="vc-phone" placeholder="+60 12 345 6789">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Website</label>
          <input type="url" id="vc-url" placeholder="https://example.com">
        </div>
      </div>

      <div id="taglink-fields" style="display: none;">
        <div style="font: var(--fw-semibold) 12px/1 var(--font-sans); color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: var(--space-3);">TagLink Content</div>
        <div class="form-group">
          <label class="form-label">Redirect URL</label>
          <input type="url" id="tl-url" placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Plain Text</label>
          <textarea id="tl-text" rows="3" maxlength="500" placeholder="Visit our website!"></textarea>
        </div>
      </div>

      <button type="submit" class="btn-primary w-full" style="margin-top: var(--space-4);">Create Card</button>
    </form>
  </div>
</div>
{% endblock %}
{% block head %}
<script>
function selectType(btn) {
  document.querySelectorAll('.card-type-btn').forEach(b => {
    b.classList.remove('active');
    b.style.borderColor = 'var(--border)';
  });
  btn.classList.add('active');
  btn.style.borderColor = 'var(--accent)';
  const type = btn.dataset.type;
  document.getElementById('card_type').value = type;
  document.getElementById('vcard-fields').style.display = type === 'social' ? 'block' : 'none';
  document.getElementById('taglink-fields').style.display = type === 'taglink' ? 'block' : 'none';
}

function buildVCard() {
  const fields = {
    'FN': document.getElementById('vc-fn').value,
    'ORG': document.getElementById('vc-org').value,
    'TITLE': document.getElementById('vc-title').value,
    'EMAIL': document.getElementById('vc-email').value,
    'TEL': document.getElementById('vc-phone').value,
    'URL': document.getElementById('vc-url').value,
  };
  let vcard = 'BEGIN:VCARD\nVERSION:4.0\n';
  for (const [key, val] of Object.entries(fields)) {
    if (val) vcard += `${key}:${val}\n`;
  }
  vcard += 'END:VCARD\n';
  return vcard;
}

async function submitCard(e) {
  e.preventDefault();
  const type = document.getElementById('card_type').value;
  const tier = document.querySelector('[name="card_tier"]').value;

  let body = { card_type: type, card_tier: tier };
  if (type === 'social') {
    body.vcard_data = buildVCard();
  } else {
    body.redirect_url = document.getElementById('tl-url').value || null;
    body.plain_text = document.getElementById('tl-text').value || null;
  }

  const token = localStorage.getItem('token');
  const res = await fetch('/api/users/me/cards', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = '/dashboard/cards/' + data.card_id;
  } else {
    alert(data.detail?.error || 'Failed to create card');
  }
}
</script>
{% endblock %}
