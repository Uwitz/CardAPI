{% extends "base.html" %}
{% block title %}New Order — {{ brand }}{% endblock %}
{% block page_title %}Place New Order{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fade-up">
  <div class="card">
    <h2 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 1rem;">Order a Physical Card</h2>
    <form id="order-form" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label class="form-label">Card Type</label>
        <select id="order-type" class="form-input" onchange="updatePrice()">
          <option value="social">Social Card — RM 35.00</option>
          <option value="corporate">Corporate Card — RM 50.00</option>
          <option value="taglink">TagLink Card — RM 15.00</option>
        </select>
      </div>
      <div id="price-summary" class="card" style="background: var(--neutral-50); margin-bottom: 1rem;">
        <div class="flex justify-between text-sm mb-1"><span>Card price</span><span id="price-base">RM 35.00</span></div>
        <div class="flex justify-between text-sm mb-1"><span>Stripe fee</span><span id="price-fee">RM 1.05</span></div>
        <div class="flex justify-between font-bold"><span>Total</span><span id="price-total">RM 36.05</span></div>
      </div>
      <button type="submit" class="btn btn-primary w-full">Checkout with Stripe</button>
    </form>
  </div>
</div>
{% endblock %}
{% block head %}
<script>
const prices = { social: 35, corporate: 50, taglink: 15 };
const feeRate = 0.03, feeMin = 0.50;

function calcFee(amt) { return Math.max(amt * feeRate, feeMin).toFixed(2); }

function updatePrice() {
  const type = document.getElementById('order-type').value;
  const base = prices[type];
  const fee = calcFee(base);
  const total = (base + parseFloat(fee)).toFixed(2);
  document.getElementById('price-base').textContent = `RM ${base.toFixed(2)}`;
  document.getElementById('price-fee').textContent = `RM ${fee}`;
  document.getElementById('price-total').textContent = `RM ${total}`;
}

async function placeOrder(e) {
  e.preventDefault();
  const token = localStorage.getItem('token');
  const type = document.getElementById('order-type').value;
  const res = await fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ card_type: type, card_tier: 'physical' }),
  });
  const data = await res.json();
  if (res.ok && data.checkout_url) {
    window.location.href = data.checkout_url;
  } else if (res.ok) {
    window.location.href = '/dashboard/orders';
  } else {
    alert(data.detail?.error || 'Order failed');
  }
}
updatePrice();
</script>
{% endblock %}
