  - paragraph [ref=f3e44]: Uwitz Cards is provided "as is" without warranties. We're not liable for indirect, incidental, or consequential damages. Our total liability doesn't exceed the amount you paid us in the last 12 months.
  - heading "10. Changes" [level=2] [ref=f3e45]
